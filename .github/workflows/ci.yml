name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-macos:
    name: Build macOS
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v7

      - name: Build for macOS
        run: |
          xcodebuild build \
            -project film-workflow.xcodeproj \
            -scheme film-workflow \
            -destination 'generic/platform=macOS' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO

  test-video-editor:
    name: Test RxVideoEditor package
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v7

      - name: Run package tests
        run: swift test --package-path Packages/RxVideoEditor
