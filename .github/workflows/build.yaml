name: Build & Release

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  release:
    types:
      - created

jobs:
  build:
    name: Build macOS App
    runs-on: self-hosted
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install create-dmg
        run: npm install --global create-dmg

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Install Python dependencies
        run: pip install markdown

      - name: Import code signing certificate
        uses: apple-actions/import-codesign-certs@v7
        with:
          p12-file-base64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          p12-password: ${{ secrets.P12_PASSWORD }}

      # The app's com.apple.developer.associated-domains entitlement (passkey
      # sign-in) is a restricted entitlement: codesign only accepts it when a
      # provisioning profile authorising it is embedded in the bundle. The
      # secret holds a base64 Developer ID profile for rxlab.film-workflow.
      - name: Install provisioning profile
        env:
          MACOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.MACOS_PROVISIONING_PROFILE_BASE64 }}
          # Must match PROVISIONING_PROFILE_SPECIFIER[sdk=macosx*] on the
          # film-workflow target's Release config in project.pbxproj.
          EXPECTED_PROFILE_NAME: FilmStudio
          PRODUCT_BUNDLE_ID: rxlab.film-workflow
        run: |
          if [ -z "$MACOS_PROVISIONING_PROFILE_BASE64" ]; then
            echo "::error::MACOS_PROVISIONING_PROFILE_BASE64 is required."
            exit 1
          fi

          PROFILE_PATH="$RUNNER_TEMP/film-workflow.provisionprofile"
          PROFILE_PLIST="$RUNNER_TEMP/film-workflow-profile.plist"
          PROFILE_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"

          mkdir -p "$PROFILE_DIR"
          printf '%s' "$MACOS_PROVISIONING_PROFILE_BASE64" | base64 -D > "$PROFILE_PATH"
          openssl cms -inform DER -verify -noverify -in "$PROFILE_PATH" -out "$PROFILE_PLIST"

          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c "Print UUID" "$PROFILE_PLIST")
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c "Print Name" "$PROFILE_PLIST")

          cp "$PROFILE_PATH" "$PROFILE_DIR/$PROFILE_UUID.provisionprofile"
          echo "Installed provisioning profile: $PROFILE_NAME ($PROFILE_UUID)"

          # xcodebuild matches the profile by name, so the secret's profile and
          # PROVISIONING_PROFILE_SPECIFIER in project.pbxproj must agree. Fail
          # here with the actual name rather than 200 lines into the archive log.
          if [ "$PROFILE_NAME" != "$EXPECTED_PROFILE_NAME" ]; then
            echo "::error::Profile is named '$PROFILE_NAME' but project.pbxproj pins PROVISIONING_PROFILE_SPECIFIER to '$EXPECTED_PROFILE_NAME'. Update one to match the other."
            exit 1
          fi

          # The profile has to cover this bundle id and carry the restricted
          # entitlement, otherwise codesign rejects the app at the end of a
          # multi-minute archive.
          PROFILE_APP_ID=$(/usr/libexec/PlistBuddy -c "Print Entitlements:com.apple.application-identifier" "$PROFILE_PLIST" 2>/dev/null || true)
          if [ "${PROFILE_APP_ID#*.}" != "$PRODUCT_BUNDLE_ID" ]; then
            echo "::error::Profile covers '${PROFILE_APP_ID:-<none>}', not '$PRODUCT_BUNDLE_ID'."
            exit 1
          fi

          if ! /usr/libexec/PlistBuddy -c "Print Entitlements:com.apple.developer.associated-domains" "$PROFILE_PLIST" >/dev/null 2>&1; then
            echo "::error::Profile lacks com.apple.developer.associated-domains. Enable Associated Domains on the App ID, then regenerate the profile."
            exit 1
          fi

          # Developer ID profiles provision all devices; a Development or App
          # Store profile here would not match the Developer ID signing identity.
          if ! /usr/libexec/PlistBuddy -c "Print ProvisionsAllDevices" "$PROFILE_PLIST" >/dev/null 2>&1; then
            echo "::warning::Profile does not look like a Developer ID profile (no ProvisionsAllDevices)."
          fi

      - name: Bump version
        run: |
          # Strip the leading 'v' from the release tag (v1.2.3 -> 1.2.3) —
          # Apple's MARKETING_VERSION must be numeric, and Sparkle compares it
          # against the appcast's shortVersionString.
          RELEASE_VERSION="${GITHUB_REF_NAME#v}"
          echo "RELEASE_VERSION=${RELEASE_VERSION}" >> "$GITHUB_ENV"
          ./scripts/ci/update-version.sh "${RELEASE_VERSION}"

      - name: Build archive
        run: |
          gem install xcpretty
          # CURRENT_PROJECT_VERSION is overridden per-build so every release has
          # a unique build number (github.run_number) without committing churn
          # to project.pbxproj. Sparkle uses it as the update ordering key.
          #
          # Manual signing with a Developer ID identity. The profile is pinned
          # to the app target's Release build settings in project.pbxproj
          # (PROVISIONING_PROFILE_SPECIFIER), NOT passed on the command line: a
          # command-line PROVISIONING_PROFILE* applies to every target in the
          # graph — including the SPM package targets, which don't support
          # provisioning profiles — and fails the archive. CODE_SIGN_STYLE and
          # CODE_SIGN_IDENTITY stay global: the package targets sign with the
          # identity but need no profile.
          set -o pipefail
          xcodebuild -destination platform=macOS \
            -project film-workflow.xcodeproj \
            -scheme film-workflow \
            -configuration Release \
            -archivePath output/output.xcarchive \
            CODE_SIGN_IDENTITY="${{ secrets.SIGNING_CERTIFICATE_NAME }}" \
            CODE_SIGN_STYLE=Manual \
            OTHER_CODE_SIGN_FLAGS="--options=runtime --timestamp" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            archive 2>&1 | tee xcodebuild-archive.log | xcpretty || {
              status=${PIPESTATUS[0]}
              echo "::group::Full xcodebuild output (archive failed)"
              cat xcodebuild-archive.log
              echo "::endgroup::"
              exit "$status"
            }

      - name: Sign Sparkle
        run: ./scripts/ci/sign-sparkle.sh
        env:
          SIGNING_CERTIFICATE_NAME: ${{ secrets.SIGNING_CERTIFICATE_NAME }}

      - name: Notarize
        run: ./scripts/ci/notary.sh
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PWD: ${{ secrets.APPLE_ID_PWD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Generate appcast
        run: ./scripts/ci/generate-appcast.sh
        env:
          SPARKLE_KEY: ${{ secrets.SPARKLE_KEY }}
          VERSION: ${{ github.ref_name }}
          BUILD_NUMBER: ${{ github.run_number }}
          RELEASE_NOTE: ${{ github.event.release.body }}

      # The appcast's download URL points here, so the asset name must stay
      # RxFilmStudio.dmg.
      - name: Upload DMG to Release
        uses: softprops/action-gh-release@v3
        with:
          files: RxFilmStudio.dmg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload appcast for deploy job
        uses: actions/upload-artifact@v7
        with:
          name: appcast-${{ github.sha }}
          path: appcast.xml
          retention-days: 1

      - name: Upload release notes for deploy job
        uses: actions/upload-artifact@v7
        with:
          name: release_notes-${{ github.sha }}
          path: release_notes.html
          retention-days: 1
          if-no-files-found: ignore

  deploy:
    name: Deploy appcast to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download appcast from build job
        uses: actions/download-artifact@v8
        with:
          name: appcast-${{ github.sha }}

      - name: Download release notes from build job
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: release_notes-${{ github.sha }}

      - name: Prepare pages directory
        run: |
          mkdir -p pages
          cp appcast.xml pages/
          if [ -f release_notes.html ]; then
            cp release_notes.html pages/
          fi
          # Pin the custom domain — without this, deploy-pages strips the CNAME
          # GitHub wrote when the domain was set in Settings → Pages, and the
          # SUFeedURL baked into every shipped app stops resolving.
          echo "update.filmstudio.rxlab.app" > pages/CNAME

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: "pages"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
